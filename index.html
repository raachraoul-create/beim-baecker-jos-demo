<section class="hero"><h1>Frësch<br>Backwaren all<br>Dag</h1><p>Tradition · Handwierk · Regional</p></section>
<div class="mode"><button id="pickup" class="active" onclick="setMode('pickup')">🏪 Abholung<br>an der Bäckerei</button><button id="delivery" onclick="setMode('delivery')">🚚 Lieferung<br>bei Iech doheem</button></div>
<main class="wrap"><h2>Eis Kategorien</h2><div class="cats"><button class="active" onclick="filterCat('Alle',this)">Alle</button><button onclick="filterCat('Brout',this)">Brout</button><button onclick="filterCat('Viennoiserie',this)">Viennoiserie</button><button onclick="filterCat('Pâtisserie',this)">Pâtisserie</button></div><h2>Beliebte Produkte</h2><div class="grid" id="products"></div></main>
<nav class="nav"><button onclick="closePanels()"><b>⌂</b>Start</button><button onclick="document.querySelector('.wrap').scrollIntoView()"><b>▦</b>Produkte</button><button onclick="openCart()"><b>🛒</b>Warenkorb <span class="badge" id="count">0</span></button><button onclick="openChef()"><b>⚙</b>Chef-Bereich</button></nav>
<section id="cart" class="panel"><button class="close" onclick="closePanels()">← Zurück</button><h2>Warenkorb</h2><div id="cartRows"></div><div class="total" id="total"></div><h3>Bestellung</h3><input id="name" placeholder="Name"><input id="phone" placeholder="Telefon"><div id="addressBox" style="display:none"><input id="address" placeholder="Lieferadresse"></div><input id="time" type="time"><textarea id="notes" placeholder="Notiz"></textarea><button class="checkout" onclick="order()">Bestellung absenden</button><p id="confirm"></p></section>
<section id="chef" class="panel"><button class="close" onclick="closePanels()">← Zurück</button><h2>Chef-Bereich</h2><div class="row"><b>Offene Bestellungen</b><span id="orders">0</span></div><div class="row"><b>Lieferungen</b><span id="deliveries">0</span></div><div class="row"><b>Demo-Umsatz</b><span id="revenue">0,00 €</span></div><h3>Produkte & Preise</h3><div id="chefProducts"></div></section>
<script>
const P=[['Baguette',2.30,'Brout','https://images.unsplash.com/photo-1549931319-a545dcf3bc73?auto=format&fit=crop&w=700&q=80'],['Croissant',1.60,'Viennoiserie','https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=700&q=80'],['Schokocroissant',1.90,'Viennoiserie','https://images.unsplash.com/photo-1623334044303-241021148842?auto=format&fit=crop&w=700&q=80'],['Bauernbrot',4.20,'Brout','https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=700&q=80'],['Sandwich',5.50,'Pâtisserie','https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=700&q=80'],['Körnerbrötchen',1.10,'Brout','https://images.unsplash.com/photo-1586444248902-2f64eddc13df?auto=format&fit=crop&w=700&q=80']];
let basket={},mode='pickup',orders=JSON.parse(localStorage.getItem('orders')||'[]');
function money(n){return n.toFixed(2).replace('.',',')+' €'}function render(cat='Alle'){products.innerHTML=P.filter(p=>cat==='Alle'||p[2]===cat).map((p,i)=>{let ix=P.indexOf(p);return '<article class="card"><img src="'+p[3]+'"><div class="b"><h3>'+p[0]+'</h3><p>'+p[2]+'</p><span class="price">'+money(p[1])+'</span><button class="add" onclick="add('+ix+')">+</button></div></article>'}).join('');chefProducts.innerHTML=P.map(p=>'<div class="row"><span>'+p[0]+'</span><b>'+money(p[1])+'</b></div>').join('')}function filterCat(c,b){document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(c)}function setMode(m){mode=m;pickup.classList.toggle('active',m==='pickup');delivery.classList.toggle('active',m==='delivery');addressBox.style.display=m==='delivery'?'block':'none'}function add(i){basket[i]=(basket[i]||0)+1;update()}function update(){count.textContent=Object.values(basket).reduce((a,b)=>a+b,0)}function openCart(){document.getElementById('cart').classList.add('open');drawCart()}function drawCart(){let t=0;cartRows.innerHTML=Object.entries(basket).filter(x=>x[1]>0).map(([i,q])=>{let p=P[i];t+=p[1]*q;return '<div class="row"><span><b>'+p[0]+'</b><br>'+money(p[1]*q)+'</span><span class="qty"><button onclick="chg('+i+',-1)">−</button> '+q+' <button onclick="chg('+i+',1)">+</button></span></div>'}).join('')||'<p>Dein Warenkorb ist leer.</p>';total.textContent='Gesamt: '+money(t)}function chg(i,d){basket[i]=Math.max(0,(basket[i]||0)+d);update();drawCart()}function order(){let t=Object.entries(basket).reduce((s,[i,q])=>s+P[i][1]*q,0);if(!name.value||!phone.value||t===0){confirm.textContent='Bitte Name, Telefon und Produkte angeben.';return}if(mode==='delivery'&&!address.value){confirm.textContent='Bitte Lieferadresse angeben.';return}orders.push({name:name.value,mode,total:t});localStorage.setItem('orders',JSON.stringify(orders));basket={};update();drawCart();confirm.textContent='✓ Bestellung wurde als Demo gespeichert.'}function openChef(){chef.classList.add('open');orders=document.getElementById('orders');let a=JSON.parse(localStorage.getItem('orders')||'[]');orders.textContent=a.length;deliveries.textContent=a.filter(x=>x.mode==='delivery').length;revenue.textContent=money(a.reduce((s,x)=>s+x.total,0))}function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))}render();update();
</script></body></html>
